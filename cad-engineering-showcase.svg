<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">Mechanical CAD &amp; Robotics Engineering Showcase</title>
  <desc id="desc">Parametric 3D mechanical modeling, kinematic robotics assemblies, tolerance stack-up analysis, and finite element validation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#040c17"/>
    </linearGradient>
    <linearGradient id="laserGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00adb5" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00adb5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="metalArm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#00adb5"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#ffd166"/>
    </marker>
    <pattern id="cadGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#162942" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="580" rx="24" fill="url(#bg)" stroke="#1e3a5f" stroke-width="2"/>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(50, 48)">
    <rect x="0" y="-8" width="8" height="48" rx="4" fill="#00adb5" filter="url(#subtleGlow)"/>
    <text x="24" y="16" fill="#f8fafc" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" letter-spacing="0.5">MECHANICAL CAD &amp; ROBOTICS ASSEMBLY ENGINEERING</text>
    <text x="24" y="38" fill="#94a3b8" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14">Parametric Design (SolidWorks / Onshape) • Multi-Body Kinematics • DFM &amp; 3D Print Tolerances • FEA Stress Analysis</text>
  </g>

  <!-- Status Chip -->
  <g transform="translate(975, 40)" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect width="175" height="34" rx="17" fill="#0c2d42" stroke="#00adb5" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="34" y="22" fill="#e2e8f0" font-size="12" font-weight="700">ISO TOLERANCE ±0.05</text>
  </g>

  <!-- ==================== LEFT: INTERACTIVE 3D CAD BLUEPRINT & KINEMATICS ==================== -->
  <g transform="translate(50, 110)">
    <rect width="520" height="395" rx="18" fill="#091423" stroke="#223956" stroke-width="2"/>
    <rect x="12" y="12" width="496" height="371" rx="12" fill="url(#cadGrid)"/>

    <text x="26" y="36" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">PARAMETRIC ASSEMBLY BLUEPRINT · LIVE KINEMATICS</text>

    <!-- Scanning Laser Beam moving vertically -->
    <g>
      <rect x="20" y="48" width="480" height="40" fill="url(#laserGrad)" opacity="0.35">
        <animate attributeName="y" values="48;330;48" dur="4.5s" repeatCount="indefinite"/>
      </rect>
      <line x1="20" y1="88" x2="500" y2="88" stroke="#38bdf8" stroke-width="2" filter="url(#subtleGlow)">
        <animate attributeName="y1" values="88;370;88" dur="4.5s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="88;370;88" dur="4.5s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- Isometric Robotic Arm / Actuator Mechanism Assembly -->
    <g transform="translate(260, 260)">
      <!-- Base Mounting Flange -->
      <ellipse cx="0" cy="40" rx="90" ry="32" fill="#1e293b" stroke="#00adb5" stroke-width="2.5" filter="url(#subtleGlow)"/>
      <ellipse cx="0" cy="35" rx="65" ry="22" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
      <!-- Bolt Circle Mounting Holes -->
      <circle cx="-50" cy="35" r="4.5" fill="#38bdf8"/>
      <circle cx="50" cy="35" r="4.5" fill="#38bdf8"/>
      <circle cx="0" cy="52" r="4.5" fill="#38bdf8"/>
      <circle cx="0" cy="18" r="4.5" fill="#38bdf8"/>

      <!-- Turret Base Hub -->
      <path d="M -35 35 L -35 -20 L 35 -20 L 35 35 Z" fill="#1e293b" stroke="#00adb5" stroke-width="2"/>
      <ellipse cx="0" cy="-20" rx="35" ry="12" fill="#0f172a" stroke="#00adb5" stroke-width="2"/>

      <!-- Link 1 Arm: Oscillating via Revolute Kinematic Joint -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-25 0 -20; 25 0 -20; -25 0 -20" dur="5s" repeatCount="indefinite"/>
        
        <!-- Main structural boom -->
        <rect x="-14" y="-140" width="28" height="120" rx="10" fill="url(#metalArm)" stroke="#cffafe" stroke-width="1.8"/>
        <!-- Weight reduction pockets -->
        <rect x="-8" y="-120" width="16" height="35" rx="5" fill="#091423" stroke="#00adb5" stroke-width="1.2"/>
        <rect x="-8" y="-75" width="16" height="35" rx="5" fill="#091423" stroke="#00adb5" stroke-width="1.2"/>

        <!-- Elbow Joint -->
        <circle cx="0" cy="-140" r="22" fill="#0f172a" stroke="#00adb5" stroke-width="2"/>
        <circle cx="0" cy="-140" r="9" fill="#38bdf8" filter="url(#subtleGlow)"/>

        <!-- Forearm & Gripper Link (Secondary articulation) -->
        <g transform="translate(0, -140)">
          <animateTransform attributeName="transform" type="rotate" values="40 0 0; -10 0 0; 40 0 0" dur="5s" repeatCount="indefinite"/>
          <rect x="-10" y="-95" width="20" height="95" rx="6" fill="#0284c7" stroke="#e0f2fe" stroke-width="1.5"/>
          <!-- Tool End Effector / Probe -->
          <circle cx="0" cy="-95" r="14" fill="#0f172a" stroke="#ffd166" stroke-width="2"/>
          <path d="M -12 -105 L 0 -130 L 12 -105" fill="none" stroke="#ffd166" stroke-width="2.5" stroke-linejoin="round"/>
          <circle cx="0" cy="-130" r="3" fill="#ffffff" filter="url(#subtleGlow)">
            <animate attributeName="r" values="2;4.5;2" dur="1s" repeatCount="indefinite"/>
          </circle>
        </g>
      </g>
    </g>

    <!-- Dimension Annotation Callouts -->
    <g font-family="'Courier New', monospace" font-size="11" fill="#38bdf8" stroke="#38bdf8">
      <line x1="80" y1="120" x2="150" y2="120" stroke-width="1.2"/>
      <line x1="150" y1="120" x2="190" y2="150" stroke-width="1.2"/>
      <text x="60" y="115" stroke="none" fill="#38bdf8" font-weight="700">R22.0 JOINT</text>

      <line x1="430" y1="210" x2="360" y2="210" stroke-width="1.2"/>
      <line x1="360" y1="210" x2="310" y2="250" stroke-width="1.2"/>
      <text x="365" y="202" stroke="none" fill="#ffd166" font-weight="700">Ø180 BASE FLANGE</text>
    </g>

    <!-- Bottom Specs Legend -->
    <g transform="translate(20, 345)" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">
      <rect width="480" height="36" rx="8" fill="#07111c" fill-opacity="0.9" stroke="#1c2d43"/>
      <circle cx="18" cy="18" r="4.5" fill="#00adb5"/>
      <text x="28" y="22" fill="#e2e8f0">Revolute Kinematics</text>
      <circle cx="160" cy="18" r="4.5" fill="#38bdf8"/>
      <text x="170" y="22" fill="#e2e8f0">Lightweight Ribs</text>
      <circle cx="295" cy="18" r="4.5" fill="#ffd166"/>
      <text x="305" y="22" fill="#ffd166">Precision Tool Center</text>
      <text x="440" y="22" fill="#34d399" font-weight="700">DFM OK</text>
    </g>
  </g>

  <!-- ==================== RIGHT: ENGINEERING WORKFLOW & ANALYSIS ==================== -->
  <g transform="translate(600, 110)" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="0" y="22" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="1.2">DESIGN FOR MANUFACTURING &amp; ANALYSIS PIPELINE</text>

    <!-- Step 1: Parametric 3D Modeling -->
    <g transform="translate(0, 40)">
      <rect width="250" height="74" rx="12" fill="#13233c" stroke="#253e61" stroke-width="1.6"/>
      <circle cx="28" cy="37" r="16" fill="#075985"/>
      <text x="23" y="43" fill="#38bdf8" font-size="16" font-weight="800">1</text>
      <text x="56" y="32" fill="#f8fafc" font-size="15" font-weight="700">Parametric Modeling</text>
      <text x="56" y="52" fill="#94a3b8" font-size="12">SolidWorks / Onshape • Fully Constrained</text>
    </g>

    <path d="M125 114 V134" stroke="#00adb5" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Step 2: Kinematic Assembly -->
    <g transform="translate(0, 138)">
      <rect width="250" height="82" rx="12" fill="#13233c" stroke="#00adb5" stroke-width="2" filter="url(#subtleGlow)"/>
      <circle cx="28" cy="41" r="16" fill="#044e54"/>
      <text x="23" y="47" fill="#2dd4bf" font-size="16" font-weight="800">2</text>
      <text x="56" y="30" fill="#f8fafc" font-size="15" font-weight="700">Assembly &amp; Mates</text>
      <text x="56" y="49" fill="#00adb5" font-size="12" font-weight="600">Revolute &amp; Cylindrical Joints</text>
      <text x="56" y="67" fill="#94a3b8" font-size="11">Range-of-Motion &amp; Interference Check</text>
    </g>

    <path d="M125 220 V240" stroke="#00adb5" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Step 3: FEA & DFM Validation -->
    <g transform="translate(0, 244)">
      <rect width="250" height="74" rx="12" fill="#13233c" stroke="#253e61" stroke-width="1.6"/>
      <circle cx="28" cy="37" r="16" fill="#075985"/>
      <text x="23" y="43" fill="#38bdf8" font-size="16" font-weight="800">3</text>
      <text x="56" y="32" fill="#f8fafc" font-size="15" font-weight="700">FEA &amp; DFM Validation</text>
      <text x="56" y="52" fill="#94a3b8" font-size="12">ANSYS Stress &amp; FDM 3D Print Fits</text>
    </g>

    <path d="M250 281 H282" stroke="#00adb5" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Right Box: Mechanical Analysis Specs -->
    <g transform="translate(290, 40)">
      <rect width="260" height="278" rx="16" fill="#0c192c" stroke="#213a5b" stroke-width="2"/>
      
      <rect x="18" y="16" width="224" height="32" rx="8" fill="#142c4c"/>
      <text x="32" y="37" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="1">MECHANICAL AUDIT</text>

      <g transform="translate(20, 60)" font-size="12">
        <rect width="220" height="36" rx="6" fill="#0f253e"/>
        <text x="12" y="23" fill="#94a3b8">Fit Tolerance:</text>
        <text x="125" y="23" fill="#34d399" font-weight="700">ISO 286 (H7/g6)</text>

        <g transform="translate(0, 44)">
          <rect width="220" height="36" rx="6" fill="#0f253e"/>
          <text x="12" y="23" fill="#94a3b8">Max Von Mises:</text>
          <text x="125" y="23" fill="#38bdf8" font-weight="700">28.4 MPa (Safe)</text>
        </g>

        <g transform="translate(0, 88)">
          <rect width="220" height="36" rx="6" fill="#0f253e"/>
          <text x="12" y="23" fill="#94a3b8">Factor of Safety:</text>
          <text x="125" y="23" fill="#34d399" font-weight="700">FOS = 3.2</text>
        </g>

        <g transform="translate(0, 132)">
          <rect width="220" height="36" rx="6" fill="#0f253e"/>
          <text x="12" y="23" fill="#94a3b8">Material Profile:</text>
          <text x="125" y="23" fill="#ffd166" font-weight="700">PETG / AL 6061</text>
        </g>

        <g transform="translate(0, 176)">
          <rect width="220" height="34" rx="6" fill="#063e3b" stroke="#00adb5"/>
          <text x="12" y="22" fill="#5eead4" font-weight="700">DFM STATUS: EXPORT READY</text>
        </g>
      </g>
    </g>

    <!-- Feedback loop -->
    <path d="M420 318 V345 H125 V332" fill="none" stroke="#ffd166" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrowAmber)">
      <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1s" repeatCount="indefinite"/>
    </path>
    <text x="210" y="360" fill="#ffd166" font-size="11" font-weight="700">PARAMETRIC REVISION &amp; CLEARANCE CHECK</text>
  </g>

  <!-- ==================== BOTTOM STATUS BAR ==================== -->
  <g transform="translate(50, 528)" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">
    <rect width="1100" height="34" rx="8" fill="#091524" stroke="#1d3049"/>
    <text x="24" y="22" fill="#64748b">SOLIDWORKS / ONSHAPE CAD</text>
    <text x="220" y="22" fill="#00adb5">→ MULTI-BODY MATES</text>
    <text x="400" y="22" fill="#00adb5">→ FEA STRESS ANALYSIS</text>
    <text x="600" y="22" fill="#00adb5">→ DFM FIT &amp; TOLERANCE</text>
    <text x="820" y="22" fill="#ffd166">→ RAPID PROTOTYPE (STL / 3D PRINT)</text>
  </g>
</svg>